name: probe hosts

# Each probe's transport follows from what its host advertises. A host that changes its HTTP/3,
# CORS or timing headers changes what a probe measures, so the contract is checked daily.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosts:
    name: probe host transport contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: check every probe host
        run: node tools/check-hosts.mjs
