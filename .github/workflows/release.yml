name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to pages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: assemble the site
        # Only the application ships. Tests, workflows and dependencies stay out of it.
        run: |
          mkdir _site
          cp -r index.html app.css sw.js manifest.webmanifest icon.svg icon-180.png icon-512.png js README.md LICENSE _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  tag:
    name: release the published version
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Keyed on whether this version is already released, not on whether the last commit
      # changed it. Diffing against the previous commit strands a version permanently if
      # the run that introduced it failed before reaching this job.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$v is deployed but not released"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: create the release
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.check.outputs.version }}
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$previous" ]; then
            log=$(git log --pretty='- %s' "$previous"..HEAD)
          else
            log=$(git log --pretty='- %s' -20)
          fi
          printf 'Live at https://enwelder.github.io/web-traffic-speedometer/\n\n%s\n' "$log" > notes.md
          gh release create "v$V" --title "v$V" --notes-file notes.md
