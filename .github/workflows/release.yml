name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to pages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: assemble the site
        # Only the application ships. Tests, workflows and dependencies stay out of it.
        run: |
          mkdir _site
          cp -r index.html app.css sw.js manifest.webmanifest icon.svg icon-180.png icon-512.png js README.md LICENSE _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  tag:
    name: tag and release on a version bump
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: version
        name: has the version changed?
        run: |
          current=$(node -p "require('./package.json').version")
          previous=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0)).version" || echo none)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$previous" ]; then
            echo "unchanged at $current; nothing to release"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "$previous -> $current"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi
      - name: create the release
        if: steps.version.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.current }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V is already released"
            exit 0
          fi
          since=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$since" ]; then
            log=$(git log --pretty='- %s' "$since"..HEAD)
          else
            log=$(git log --pretty='- %s' -20)
          fi
          printf 'Live at https://enwelder.github.io/web-traffic-speedometer/\n\n%s\n' "$log" > notes.md
          gh release create "v$V" --title "v$V" --notes-file notes.md
