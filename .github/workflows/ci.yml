name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  functional:
    name: functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: coding standards
        run: npx eslint .
      - name: unit and integration
        run: node tests/run.mjs unit stuck wakelock position
      - name: grading, and replay against real recordings
        run: node tests/run.mjs grading replay regressions
      - name: boundary values, network events and rollups
        run: node tests/run.mjs edges
      # --with-deps runs apt-get update, and the runner image ships third-party repositories
      # this project does not need. Google's has been serving an index whose hash does not
      # match its own Release file, which fails the whole update and so the whole step. Drop
      # any source that mentions it — the file is .list on some images and .sources on others —
      # and list what is left, so a future failure here names its own cause.
      - name: install browsers
        run: |
          grep -rlE 'dl\.google\.com|google-chrome' /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -f
          [ -f /etc/apt/sources.list ] && sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list
          echo "remaining apt sources:"; ls -1 /etc/apt/sources.list.d/ || true
          sudo apt-get update
          npx playwright install --with-deps chromium webkit
      - name: end to end in a browser
        run: node tests/run.mjs browser

  security:
    name: security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: allowlist, exfiltration, CSP, secrets, version consistency
        run: node tests/run.mjs security
      - name: no runtime dependencies may be introduced
        run: |
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('package.json')).dependencies ? 1 : 0)"; then
            echo "no runtime dependencies"
          else
            echo "::error::a runtime dependency was added; this app must ship no third-party code"
            exit 1
          fi
      - name: audit development dependencies
        run: npm audit --audit-level=high
